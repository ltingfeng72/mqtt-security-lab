services:
  mosquitto:
    # Official Eclipse Mosquitto image for the local lab.
    image: eclipse-mosquitto:2
    container_name: mosquitto-lab
    restart: unless-stopped
    ports:
      # Expose MQTT only on the local loopback interface.
      - "127.0.0.1:1883:1883"
    volumes:
      - ./lab/config:/mosquitto/config
      - ./lab/data:/mosquitto/data
      - ./lab/logs:/mosquitto/log
